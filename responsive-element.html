<div style="background: var(--theme-surface); border-radius: 12px; border: 1px solid rgba(var(--theme-primary-rgb), 0.1); padding: 1rem; min-height: auto; height: auto; max-height: fit-content; display: flex; flex-direction: column; box-shadow: rgba(0, 0, 0, 0.1) 0px 2px 8px; transition: 0.3s; transform: translateY(0px);">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; padding: 0.5rem 0px;">
    <div style="display: flex; align-items: center; gap: 0.5rem;">
      <div style="width: 6px; height: 6px; border-radius: 50%; background: rgb(76, 175, 80); box-shadow: rgba(76, 175, 80, 0.4) 0px 0px 6px;"></div>
      <span style="font-size: 0.75rem; color: rgba(var(--theme-primary-rgb), 0.8); font-weight: 400;">当前活跃：推特 / Twitter</span>
    </div>
    <div title="此信息可能会更新" style="font-size: 0.875rem; color: rgba(var(--theme-primary-rgb), 0.4); cursor: pointer; padding: 0.25rem; border-radius: 4px; transition: 0.2s;">
      <i class="ri-refresh-line"></i>
    </div>
  </div>
  <div style="display: flex; justify-content: space-between; align-items: center; padding: 0.75rem; background: rgba(var(--theme-primary-rgb), 0.05); border-radius: 8px; border: 1px solid rgba(var(--theme-primary-rgb), 0.1); margin-bottom: 1rem;">
    <div style="display: flex; align-items: center; gap: 0.5rem;">
      <span style="font-size: 0.875rem; color: var(--theme-primary); font-weight: 500;">@k</span>
    </div>
    <div style="display: flex; gap: 0.25rem;">
      <button title="复制用户名" style="padding: 0.25rem; background: transparent; color: rgba(var(--theme-primary-rgb), 0.6); border: none; border-radius: 4px; cursor: pointer; font-size: 0.75rem; display: flex; align-items: center; transition: 0.2s;">
        <i class="ri-file-copy-line"></i>
      </button>
      <button title="跳转到页面" style="padding: 0.25rem; background: transparent; color: rgba(var(--theme-primary-rgb), 0.6); border: none; border-radius: 4px; cursor: pointer; font-size: 0.75rem; display: flex; align-items: center; transition: 0.2s;">
        <i class="ri-external-link-line"></i>
      </button>
    </div>
  </div>
</div>
